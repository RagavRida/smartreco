{% extends "base.html" %}
{% block title %}Not found — {{ app_name }}{% endblock %}

{% block content %}
<div class="panel narrow stagger-1" style="text-align:center; padding: 60px 40px; border-radius: 24px; box-shadow: var(--shadow-lg);">
  <div style="font-size: 80px; font-weight: 800; line-height: 1; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px;">404</div>
  <h1 style="margin:0 0 16px;font-size:28px; font-weight: 700; letter-spacing: -0.02em;">We couldn't find that page</h1>
  <p class="muted" style="font-size: 16px; margin: 0 0 32px; max-width: 300px; margin-left: auto; margin-right: auto;">It may have been unpublished, moved, or the link might be broken.</p>
  <a class="btn" href="/catalog" style="padding: 14px 28px;">Browse the catalog <span>→</span></a>
</div>
{% endblock %}
