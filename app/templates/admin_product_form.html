{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product — Admin{% endblock %}

{% block content %}
<div class="page-head js-reveal animate-reveal flex justify-between items-end gap-20">
  <div>
    <span class="eyebrow"><a href="/admin/products" style="color: var(--muted-slate);">Admin</a> / Products</span>
    <h1 class="display" style="font-size: 32px; color: var(--paper);">{{ 'Edit Product' if product else 'New Product' }}</h1>
  </div>
</div>

<div class="admin-panel js-reveal animate-reveal max-w-800">
  {% if error %}<div style="padding: 16px; background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; border-radius: var(--radius); margin-bottom: 24px;">{{ error }}</div>{% endif %}

  <form class="stack" method="post" action="{{ '/admin/products/%s/edit' % product.id if product else '/admin/products/new' }}">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required value="{{ product.title if product else '' }}">
      </div>
      <div>
        <label for="slug">Slug <span style="color: #626883; font-weight: 400; font-size: 12px;">(URL friendly)</span></label>
        <input type="text" id="slug" name="slug" required value="{{ product.slug if product else '' }}" pattern="^[a-z0-9-]+$">
      </div>
    </div>
    
    <div>
      <label for="description">Description <span style="color: #626883; font-weight: 400; font-size: 12px;">(This forms the vector embedding — be descriptive)</span></label>
      <textarea id="description" name="description" required style="min-height: 120px;">{{ product.description if product else '' }}</textarea>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
      <div>
        <label for="category">Category</label>
        <input type="text" id="category" name="category" required value="{{ product.category if product else '' }}" placeholder="e.g. engineering">
      </div>
      <div>
        <label for="level">Level</label>
        <select id="level" name="level">
          {% for lvl in ['beginner', 'intermediate', 'advanced'] %}
            <option value="{{ lvl }}" {{ 'selected' if product and product.level == lvl else '' }}>{{ lvl|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="price">Price ($)</label>
        <input type="number" id="price" name="price" required min="0" step="1" value="{{ product.price if product else 0 }}">
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div>
        <label for="instructor">Instructor</label>
        <input type="text" id="instructor" name="instructor" value="{{ product.instructor if product else '' }}">
      </div>
      <div>
        <label for="duration_hours">Duration (Hours)</label>
        <input type="number" id="duration_hours" name="duration_hours" min="1" step="0.5" value="{{ product.duration_hours if product else 1.0 }}">
      </div>
    </div>

    <div>
      <label for="tags">Tags <span style="color: #626883; font-weight: 400; font-size: 12px;">(comma separated)</span></label>
      <input type="text" id="tags" name="tags" value="{{ product.tags if product else '' }}" placeholder="python, dataviz, tooling">
    </div>

    <div style="margin: 20px 0;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 400;">
        <input type="checkbox" name="is_published" style="width: 18px; height: 18px; accent-color: var(--coral);" {{ 'checked' if product and product.is_published else '' }}>
        Published to catalog
      </label>
    </div>

    <div style="border-top: 1px solid #E2E0D8; padding-top: 24px; display: flex; justify-content: space-between; align-items: center;">
      <a href="/admin/products" style="color: #626883; font-weight: 500;">Cancel</a>
      <button class="btn coral" type="submit">Save Product</button>
    </div>
  </form>
</div>
{% endblock %}
