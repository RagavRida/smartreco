{% extends "base.html" %}
{% block title %}Create account — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-layout js-reveal animate-reveal">
  <div class="auth-atmosphere">
    <div class="live-feed">
      agent watching 1,204 sessions...
    </div>
  </div>
  
  <div class="auth-form-container">
    <div class="auth-card">
      <h1 class="display">Create account</h1>
      <p>Join {{ app_name }} today</p>

      {% if error %}<div style="color: var(--coral); font-size: 14px; margin-bottom: 16px;">{{ error }}</div>{% endif %}

      <form class="stack" method="post" action="/register">
        <div>
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" value="{{ email|default('') }}" required autofocus placeholder="name@company.com">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required placeholder="••••••••">
        </div>
        <button class="btn coral w-full mt-16" type="submit">Create account</button>
      </form>

      <div class="mt-32 pt-24" style="border-top: 1px solid #E2E0D8; font-size: 14px; color: var(--muted-slate);">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
